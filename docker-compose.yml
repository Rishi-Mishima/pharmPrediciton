services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pharmaml
      POSTGRES_USER: pharmaml
      POSTGRES_PASSWORD: pharmaml
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaml -d pharmaml"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pharmaml:pharmaml@db:5432/pharmaml
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 12

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pharmaml:pharmaml@db:5432/pharmaml
    command: python -m scripts.seed_database
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_HOSTPORT: api:8000
      PORT: 80
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
